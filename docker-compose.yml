services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: biblioteca_db
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: password_secret
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_NAME: biblioteca_db
      DB_USER: user_admin
      DB_PASS: password_secret
    depends_on:
      - db

volumes:
  db_data: